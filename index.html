<!DOCTYPE html>
<html>
  <head>
    <title>地元マップ</title>
    <script async src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAyLSDIMxqiob7aTN29Z-CPYIqBjFi5DEI&callback=initMap"></script>
    <!-- jsファイル読み込み -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!--jQueryを読み込み-->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
    <!--jQuery UIを読み込み-->
    <script src="https://ajax.googleapis.com/ajax/libs/jqueryui/1.12.1/jquery-ui.min.js"></script>
    <link rel="stylesheet" href="https://ajax.googleapis.com/ajax/libs/jqueryui/1.12.1/themes/ui-darkness/jquery-ui.css">
    <link rel="stylesheet" href="./css/common.css">

    <!-- 追加したい機能 -->
      <!-- ピンの上に最寄駅からの距離を表示 -->
      <!--  -->
  </head>

  <body>
    <h1>地元マップ</h1>


    <div id="map"></div>


    <script>
      function initMap() {
        let activeInfoWindow = null;

        const locations = [
          {
            kazari: './images/kazari-1.png',
            position: { lat: 34.84476057707943, lng: 136.53797334064197 },
            title: '鈴鹿サーキット',
            subname: 'suzuka circuit',
            colorClass: 'suzuka',
            image: './images/image.png',
            address: '三重県鈴鹿市稲生町',
            phone: '059-378-1111',
            link: './suzuka.html',
            oneword: '日本を代表する国際レーシングコース'
          },

          {
            kazari: './images/kazari-2.png',
            position: { lat: 35.081019, lng: 136.699558 },
            title: 'なばなの里',
            subname: 'nabana no sato',
            colorClass: 'nabana',
            image: './images/image2.png',
            address: '三重県桑名市長島町',
            phone: '0594-41-0787',
            link: './nabana.html',
            oneword: '四季折々の花々とイルミネーションが楽しめる観光スポット'
          },

          {
            kazari: './images/kazari-3.png',
            position: { lat: 34.4550, lng: 136.7259},
            title: '伊勢神宮',
            subname: 'ise jingu',
            colorClass: 'ise',
            image: './images/image3.png',
            address: '三重県伊勢市',
            phone: '0596-24-1111',
            link: './ise.html',
            oneword: '日本の神道の総本山であり、歴史的・文化的に重要な神社'
          }


        ];//const locations
        

        const fixedCenter = locations[0].position;
        const map = new google.maps.Map(document.getElementById('map'), {
          center: fixedCenter,
          zoom: 10,
          zoomControl: true,
          mapTypeControl: true,
          scaleControl: false
        });

        
        function getDistanceText(from, to) {
          const earthRadiusKm = 6371;
          const lat1 = from.lat * Math.PI / 180;
          const lat2 = to.lat * Math.PI / 180;
          const latDiff = (to.lat - from.lat) * Math.PI / 180;
          const lngDiff = (to.lng - from.lng) * Math.PI / 180;

          const a = Math.sin(latDiff / 2) * Math.sin(latDiff / 2) +
            Math.cos(lat1) * Math.cos(lat2) *
            Math.sin(lngDiff / 2) * Math.sin(lngDiff / 2);
          const distanceKm = earthRadiusKm * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));

          if (distanceKm < 1) {
            return Math.round(distanceKm * 1000) + 'm';
          }

          return distanceKm.toFixed(1) + 'km';
        }

        function normalizeLink(link) {
          const trimmed = String(link || '').trim();
          if (!trimmed) {
            return '#';
          }
          if (/^https?:\/\//i.test(trimmed) || /^(?:\.\.\/|\.\/|\/|#)/.test(trimmed)) {
            return trimmed;
          }
          return 'https://' + trimmed;
        }

        function addLocationMarkers(currentPosition) {
          locations.forEach((location) => {
            const marker = new google.maps.Marker({
              position: location.position,
              map: map,
              title: location.title
            });

            const detailUrl = normalizeLink(location.link);

            const infowindow = new google.maps.InfoWindow({
              content:
                '<div class="kazari ' + location.colorClass + '">' +
                '<img src="' + location.kazari + '" alt="飾り" >' +
                '</div>' +
                '<div class="main">' +

                '<div class="subname">' +
                  '<div class="line left-line ' + location.colorClass + '"></div>' +
                  '<h2 class="location-name ' + location.colorClass + '">' + location.subname + '</h2>' +
                  '<div class="line right-line ' + location.colorClass + '"></div>' +
                '</div>' +

                '<h2 class="location-title">' + location.title + '</h2>' +
                '<img src="' + location.image + '" alt="' + location.title + '" width="80%" height="100%">' +
                
                '<div class="ad-num">' +
                  '<div class="info-item">' +
                    '<span class="icon ' + location.colorClass + '">📍</span>' +
                    '<p class="location-address ' + location.colorClass + '">住所: ' + location.address + '</p>' +
                  '</div>' +
                  '<div class="info-item">' +
                    '<span class="icon ' + location.colorClass + '">☎</span>' +
                    '<p class="location-phone ' + location.colorClass + '">電話番号: ' + location.phone + '</p>' +
                  '</div>' +
                '</div>'+

                '<div class="footer">' +
                  '<p class="location-oneword ' + location.colorClass + '">' + location.oneword + '</p>' +
                  '<p class="location-detail-link"><a href="' + detailUrl + '" target="_blank" rel="noopener">詳細＞＞</a></p>' +
                '</div>'+
                  
                '</div>'//終わり
            });


            //ピント距離ラベルを作る
            const distanceWindow = new google.maps.InfoWindow({
              content: '<div class="distance-label">' + getDistanceText(currentPosition, location.position) + '</div>',
              disableAutoPan: true,
              pixelOffset: new google.maps.Size(0, -38)
            });

            

            distanceWindow.open(map, marker);

            marker.addListener('click', function () {
              if (activeInfoWindow) {
                activeInfoWindow.close();
              }
              activeInfoWindow = infowindow;
              infowindow.open(map, marker);
            });
          });


        }

        // ブラウザが Geolocation に対応しているか確認
        if ("geolocation" in navigator) {

          // オプション設定
          const options = {
            enableHighAccuracy: true, // 高精度モード（GPSを使う / 起動に少し時間がかかる場合あｒる）
            timeout: 15000,            // 秒以内に取得できなければエラーにする
            maximumAge: 0             // キャッシュを使わず、必ず最新の位置を取得する
          };

          // 成功時の処理
          //positionオブジェクトから井戸、軽度、誤差を取り出してlat,lagに加工するやつ
          const successCallback = (position) => {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            const accuracy = position.coords.accuracy; // 精度（メートル単位）

            console.log(`取得成功！ 緯度: ${lat}, 経度: ${lng} (誤差: 約${accuracy}m)`);

            // ここは名前：実際の数値の関係
            const currentPosition = { lat: lat, lng: lng };

            // 現在地のピンを追加
            const currentMarker = new google.maps.Marker({
              position: currentPosition,
              map: map,
              title: '現在地',
              icon: {
                path: google.maps.SymbolPath.CIRCLE,
                scale: 10,
                fillColor: '#1a73e8',
                fillOpacity: 1,
                strokeColor: '#ffffff',
                strokeWeight: 2
              }
            });

            // 鈴鹿サーキットを中心に固定
            map.setCenter(fixedCenter);
            map.setZoom(10);

            // 現在地の情報ウィンドウを作成
            const currentInfoWindow = new google.maps.InfoWindow({
              content: '<p>現在地です（誤差: 約' + Math.round(accuracy) + 'm）</p>'
            });

            currentMarker.addListener('click', function () {
              if (activeInfoWindow) {
                activeInfoWindow.close();
              }
              activeInfoWindow = currentInfoWindow;
              currentInfoWindow.open(map, currentMarker);
            });

            addLocationMarkers(currentPosition);
          };

          // エラーー発生時の処理
          const errorCallback = (error) => {
            switch (error.code) {
              case error.PERMISSION_DENIED:
                alert("位置情報の利用が許可されませんでした。");
                break;
              case error.POSITION_UNAVAILABLE:
                alert("現在地を取得できませんでした");
                break;
              case error.TIMEOUT:
                alert("取得処理がタイムアウト");
                break;
              default:
                alert("原因不明のエラーが発生");
                break;
            }
          };

          map.addListener('click', function () {
            if (activeInfoWindow) {
              activeInfoWindow.close();
              activeInfoWindow = null;
              

            }
          });

          // 実行
          navigator.geolocation.getCurrentPosition(successCallback, errorCallback, options);

        } else {
          alert("お使いのブラウザは位置情報サービスに対応していません。");
        }
      }
    </script>
  </body>
</html>
