<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>伊勢神宮</title>

<style>
* {
    box-sizing: border-box;
}
body {
    margin: 0;
}
.spotimage {
    position: relative;
    width: 100%;
    height: 700px;
    overflow: hidden;
}
/* 画像 */
.spotimage img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}
/* 画像の上に白グラデーションを重ねる */
.spotimage::after {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(
        to right,
        rgba(255, 255, 255, 0) 45%,
        rgba(255, 255, 255, 0.2) 55%,
        rgba(255, 255, 255, 0.6) 70%,
        rgba(255, 255, 255, 0.9) 82%,
        rgba(255, 255, 255, 1) 92%
    );
    /* 文字より後ろにする */
    z-index: 1;
}
/* 右側の文章 */
.text {
    position: absolute;
    top: 50%;
    right: 5%;
    transform: translateY(-50%);
    width: 35%;
    color: #222;
    z-index: 2;
}
.text h2 {
    font-size: 36px;
    margin: 0 0 20px;
}
.text p {
    font-size: 20px;
    line-height: 1.8;
    margin: 0;
}
#back {
    position: absolute;
    right: 30px;
    bottom: 100px;
    z-index: 3;
}
#back a {
    display: inline-block;
    padding: 12px 22px;
    background: #5ad0ff;
    color: #fff;
    text-decoration: none;
    border-radius: 999px;
    font-size: 18px;
    font-weight: 700;
    box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
    transition: 0.2s ease;
}
#back a:hover {
    background: #5ad0ff;
    transform: translateY(-1px);
}
</style>
</head>

<body>

    <div class="spotimage">

        <!-- ここで画像を指定 -->
        <img src="./images/ise.png" alt="伊勢神宮">

        <!-- 右側の文字 -->
        <div class="text">

            <h2>伊勢神宮</h2>

            <p>
                伊勢神宮は、三重県伊勢市に位置する日本の伝統的な神社です。<br>
                大和時代から祀られており、日本の文化や歴史に深く根付いています。<br>
                毎年多くの参拝者が訪れ、伝統行事や祭りに参加します。<br>
            </p>

        </div>
            <div id ="back">
                <a href="tiiki.html">戻る</a>
            </div>


    </div>

</body>

</html>
