<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>鈴鹿サーキット</title>

<style>
* {
    box-sizing: border-box;
}
body {
    margin: 0;
}
.spotimage {
    position: relative;
    width: 100%;
    height: 700px;
    overflow: hidden;
}
/* 画像 */
.spotimage img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}
/* 画像の上に白グラデーションを重ねる */
.spotimage::after {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(
        to right,
        rgba(255, 255, 255, 0) 45%,
        rgba(255, 255, 255, 0.2) 55%,
        rgba(255, 255, 255, 0.6) 70%,
        rgba(255, 255, 255, 0.9) 82%,
        rgba(255, 255, 255, 1) 92%
    );
    /* 文字より後ろにする */
    z-index: 1;
}
/* 右側の文章 */
.text {
    position: absolute;
    top: 50%;
    right: 5%;
    transform: translateY(-50%);
    width: 35%;
    color: #222;
    z-index: 2;
}
.text h2 {
    font-size: 36px;
    margin: 0 0 20px;
}
.text p {
    font-size: 20px;
    line-height: 1.8;
    margin: 0;
}
#back {
    position: absolute;
    right: 30px;
    bottom: 100px;
    z-index: 3;
}
#back a {
    display: inline-block;
    padding: 12px 22px;
    background: #d71920;
    color: #fff;
    text-decoration: none;
    border-radius: 999px;
    font-size: 18px;
    font-weight: 700;
    box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
    transition: 0.2s ease;
}
#back a:hover {
    background: #b81018;
    transform: translateY(-1px);
}
</style>
</head>

<body>

    <div class="spotimage">

        <!-- ここで画像を指定 -->
        <img src="./images/suzuka.png" alt="鈴鹿サーキット">

        <!-- 右側の文字 -->
        <div class="text">

            <h2>鈴鹿サーキット</h2>

            <p>
                鈴鹿サーキットは、三重県鈴鹿市に位置するモータースポーツ施設です。<br>
                F1やJGPなどの国際大会の開催場所として知られ、多くのファンを魅了しています。<br>
                車両の高速走行や技術的な挑戦が楽しめるこの場所は、モータースポーツファンにとって欠かせない存在です。
            </p>
        </div>
            <div id ="back">
                <a href="tiiki.html">戻る</a>
            </div>

    </div>

</body>

</html>
